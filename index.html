<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Magnet / Mirror</title>
  <meta name="description" content="Turn any SVG into a repeating grid that reacts to a magnet or a mirror.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Magnet <span class="brand__slash">/</span> Mirror</div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Mode"></nav>
    <button type="button" class="btn btn--ghost" id="panelToggle" aria-controls="panel" aria-expanded="false">Settings</button>
  </header>

  <main class="layout">
    <section class="stage" id="stage" aria-label="Canvas">
      <canvas id="canvas"></canvas>
      <div class="drop-hint" aria-hidden="true">Drop .svg files to add them</div>
    </section>

    <aside class="panel" id="panel" aria-label="Settings">
      <section class="group group--mode">
        <h2 class="group__title" id="modeTitle"></h2>
        <p class="group__blurb" id="modeBlurb"></p>
        <div id="modeParams"></div>
      </section>

      <section class="group">
        <h2 class="group__title">Shape</h2>
        <div class="seg seg--wrap" id="presets" role="group" aria-label="Shape preset"></div>
        <ul class="thumbs" id="uploadList" aria-label="Uploaded shapes" hidden></ul>
        <div class="shape-actions">
          <label class="btn btn--upload">
            Add .svg files
            <input type="file" id="fileInput" accept=".svg,image/svg+xml" multiple>
          </label>
          <button type="button" class="btn" id="shuffle">Shuffle</button>
        </div>
        <div id="shapeParams"></div>
        <p class="status" id="shapeStatus" role="status"></p>
      </section>

      <section class="group">
        <h2 class="group__title">Grid</h2>
        <div id="gridParams"></div>
      </section>

      <section class="group">
        <h2 class="group__title">Motion</h2>
        <div id="motionParams"></div>
      </section>

      <section class="group">
        <h2 class="group__title">Colour</h2>
        <div class="color-row" id="colorParams"></div>
      </section>

      <div class="group group--actions">
        <button type="button" class="btn" id="savePng">Save PNG</button>
      </div>
    </aside>
  </main>

  <script src="js/util.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/pointer.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/shapes.js"></script>
  <script src="js/shape-set.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/modes/magnet.js"></script>
  <script src="js/modes/mirror.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
